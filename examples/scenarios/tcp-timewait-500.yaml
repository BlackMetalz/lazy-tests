version: v1
name: tcp-timewait-500
protocol: tcp
target:
  host: 127.0.0.1
  port: 8080
workload:
  pattern: connect-churn
  connections: 200
  connect_rate_per_sec: 100
  duration: 5s
timeouts:
  connect: 500ms
assertions:
  max_error_rate_pct: 10
  max_p95_connect_ms: 100
safety:
  max_connections_cap: 2000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: false
