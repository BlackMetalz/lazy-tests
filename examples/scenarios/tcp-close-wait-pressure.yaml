version: v1
name: tcp-close-wait-pressure
protocol: tcp
target:
  host: 127.0.0.1
  port: 18080
workload:
  pattern: connect-churn
  connections: 1200
  connect_rate_per_sec: 400
  duration: 30s
timeouts:
  connect: 800ms
assertions:
  max_error_rate_pct: 20
  max_p95_connect_ms: 200
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: true
    listen_addr: 127.0.0.1:2112
