version: v1
name: tcp-conntrack-storm
protocol: tcp
target:
  host: 127.0.0.1
  port: 8080
workload:
  pattern: connect-churn
  connections: 1500
  connect_rate_per_sec: 700
  duration: 45s
timeouts:
  connect: 700ms
assertions:
  max_error_rate_pct: 15
  max_p95_connect_ms: 200
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: true
    listen_addr: 127.0.0.1:2112
