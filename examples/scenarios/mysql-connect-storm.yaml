version: v1
name: mysql-connect-storm
protocol: mysql
target:
  host: 127.0.0.1
  port: 3306
auth:
  username: root
  password: root
  database: mysql
workload:
  pattern: connect-churn
  connections: 1200
  connect_rate_per_sec: 450
  duration: 45s
timeouts:
  connect: 1s
assertions:
  max_error_rate_pct: 20
  max_p95_connect_ms: 250
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: true
    listen_addr: 127.0.0.1:2112
