version: v1
name: redis-connect-churn
protocol: redis
target:
  host: 127.0.0.1
  port: 6379
auth:
  password: redis
  redis_db: 0
workload:
  pattern: connect-churn
  connections: 500
  connect_rate_per_sec: 200
  duration: 45s
timeouts:
  connect: 1s
assertions:
  max_error_rate_pct: 3
  max_p95_connect_ms: 120
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: true
    listen_addr: 127.0.0.1:2112
