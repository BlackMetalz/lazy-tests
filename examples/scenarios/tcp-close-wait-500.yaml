version: v1
name: tcp-close-wait-500
protocol: tcp
target:
  host: 127.0.0.1
  port: 18080
workload:
  pattern: half-close-hold
  connections: 500
  connect_rate_per_sec: 100
  duration: 5m
  hold_time: 5m
timeouts:
  connect: 2s
assertions:
  max_error_rate_pct: 20
  max_p95_connect_ms: 500
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: false
    listen_addr: 127.0.0.1:2112
