version: v1
name: tcp-docker-nat
protocol: tcp
target:
  host: 127.0.0.1
  port: 18080
workload:
  pattern: connect-churn
  connections: 1000
  connect_rate_per_sec: 500
  duration: 40s
timeouts:
  connect: 1s
assertions:
  max_error_rate_pct: 10
  max_p95_connect_ms: 250
safety:
  max_connections_cap: 3000
  private_network_only: true
output:
  report_dir: ./reports
  prometheus:
    enabled: true
    listen_addr: 127.0.0.1:2112
